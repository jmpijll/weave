name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weave
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U weave -d weave"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: postgres://weave:weave@localhost:5432/weave
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify pinned pnpm
        run: npm exec --yes --package=pnpm@10.13.1 -- pnpm --version

      - name: Install dependencies
        run: npm exec --yes --package=pnpm@10.13.1 -- pnpm install --frozen-lockfile

      - name: Type-check all workspace consumers
        run: npm exec --yes --package=pnpm@10.13.1 -- pnpm check

      - name: Run evidence retention policy
        run: npm exec --yes --package=pnpm@10.13.1 -- pnpm evidence

      - name: Run workspace smoke tests
        run: npm exec --yes --package=pnpm@10.13.1 -- pnpm test
